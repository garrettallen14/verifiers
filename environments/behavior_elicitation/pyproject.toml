[project]
name = "behavior-elicitation"
version = "0.1.0"
dependencies = [
    "verifiers>=0.1.2",
    "datasets",
    "openai>=1.0.0",
    "vllm>=0.4.0",
    "tenacity>=8.0.0",
    "accelerate>=0.20.0",
    "transformers>=4.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["behavior_elicitation.py"]
